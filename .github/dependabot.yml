version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      symfony:
        patterns: ['symfony/*']
      nubit:
        patterns: ['nubitio/*']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nubit:
        patterns: ['@nubitio/*']
    ignore:
      # @nubitio/core 1.1.1 subscribes with the Mercure v1 protocol (`?match`),
      # which the v0.24 hub pinned in compose.yaml does not understand. Lift this
      # once the stack migrates to a v1 hub.
      - dependency-name: '@nubitio/*'
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
