name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Compatibility declaration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate declared package lines
        env:
          NUBIT_SKIP_SOURCE_CONTRACTS: '1'
        run: node scripts/check-compatibility.mjs

  backend:
    name: Backend (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql
          coverage: none

      - name: Validate composer manifest
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Static analysis (no new issues)
        run: composer stan

      - name: PHP lint (no new issues)
        run: composer lint

      - name: Lint YAML config
        run: php bin/console lint:yaml config --parse-tags

      - name: Lint the container
        run: php bin/console lint:container

      - name: Verify production-default detector
        run: |
          set +e
          php bin/console app:doctor --strict
          status=$?
          set -e
          test "$status" -eq 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from frontend/package.json "packageManager"
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

  smoke:
    name: Compose smoke (login + CRUD round-trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app service bind-mounts the checkout, so vendor/ must exist on
      # the host before the container boots. --ignore-platform-reqs: the
      # composer image runs an older PHP than the app (8.5).
      - name: Install backend dependencies
        run: docker run --rm -v "$PWD":/app -w /app composer:2 composer install --no-interaction --no-progress --no-scripts --ignore-platform-reqs

      - name: Start the stack
        run: docker compose up -d --build app database mercure

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:8000/api/docs.jsonld; then
              echo "app is up"; exit 0
            fi
            sleep 3
          done
          echo "app never became ready" >&2
          exit 1

      - name: Migrate and seed
        run: |
          docker compose exec -T app php bin/console doctrine:migrations:migrate --no-interaction
          docker compose exec -T app php bin/console app:seed

      - name: Login + CRUD round-trip
        run: |
          set -euo pipefail

          status=$(curl -s -c /tmp/cj -o /tmp/login.json -w '%{http_code}' \
            -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin@example.com","password":"admin1234"}')
          [ "$status" = "200" ] || { echo "login: $status"; cat /tmp/login.json; exit 1; }

          status=$(curl -s -b /tmp/cj -o /tmp/create.json -w '%{http_code}' \
            -X POST http://localhost:8000/api/products \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Smoke","sku":"CI-1","price":"9.99","active":true}')
          [ "$status" = "201" ] || { echo "create: $status"; cat /tmp/create.json; exit 1; }
          id=$(python3 -c "import json;print(json.load(open('/tmp/create.json'))['id'])")

          # Grid query path: DataGridFilter + pagination headers
          curl -s -b /tmp/cj -D /tmp/headers.txt -o /dev/null \
            'http://localhost:8000/api/products?filter%5B0%5D%5B0%5D=name&filter%5B0%5D%5B1%5D=contains&filter%5B0%5D%5B2%5D=CI%20Smoke'
          grep -qi 'x-total-count: 1' /tmp/headers.txt || { echo "grid filter did not find the row"; cat /tmp/headers.txt; exit 1; }

          status=$(curl -s -b /tmp/cj -o /dev/null -w '%{http_code}' \
            -X DELETE "http://localhost:8000/api/products/$id")
          [ "$status" = "204" ] || { echo "delete: $status"; exit 1; }

          echo "smoke OK (create $id, filter, delete)"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 100

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install backend dependencies
        run: docker run --rm -v "$PWD":/app -w /app composer:2 composer install --no-interaction --no-progress --no-scripts --ignore-platform-reqs

      - name: Start the API stack
        run: docker compose up -d --build app database mercure

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:8000/api/docs.jsonld; then
              echo "app is up"; exit 0
            fi
            sleep 3
          done
          echo "app never became ready" >&2
          exit 1

      - name: Migrate and seed
        run: |
          docker compose exec -T app php bin/console doctrine:migrations:migrate --no-interaction
          docker compose exec -T app php bin/console app:seed

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and preview the admin
        working-directory: frontend
        run: |
          pnpm build
          pnpm preview --host --port 5174 &
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:5174/; then
              echo "frontend is up"; exit 0
            fi
            sleep 2
          done
          echo "frontend never became ready" >&2
          exit 1

      - name: Run Playwright
        working-directory: frontend
        run: PLAYWRIGHT_BASE_URL=http://localhost:5174 pnpm e2e

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 100
