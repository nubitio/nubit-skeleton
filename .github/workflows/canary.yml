name: Nubit compatibility canary

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nubit-skeleton
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: nubit-skeleton/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nubit-skeleton/frontend/pnpm-lock.yaml
      - name: Resolve latest packages in the declared lines
        working-directory: nubit-skeleton
        run: |
          composer update 'nubitio/*' --with-all-dependencies --no-interaction --no-progress
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend update '@nubitio/*'
      - name: Execute backend and frontend contract fixtures
        working-directory: nubit-skeleton
        run: node scripts/check-compatibility.mjs
      - name: Build latest compatible frontend
        working-directory: nubit-skeleton/frontend
        run: pnpm build
