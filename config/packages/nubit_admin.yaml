nubit_admin:
    app_profile: saas
    auth:
        secret: '%env(APP_SECRET)%' # >= 32 bytes
        access_token_ttl: 3600
        refresh_token_ttl: 1209600
        # Secure cookies require HTTPS. The local docker stack runs plain HTTP,
        # so dev disables the flag below — keep it true in production.
        cookie_secure: true
    # Mercure subscriber cookie: the React grids (mercure: true resources)
    # receive live updates through the hub in compose.yaml.
    mercure:
        enabled: true
        secret: '%env(MERCURE_JWT_SECRET)%'
    # Media library: POST /api/media multipart uploads, local storage in
    # var/uploads by default. Pair with x-crud format:'image'|'file' hints
    # (see Product::$photo). Swap to S3 via media.storage.filesystem.
    media:
        enabled: true
    # Audit trail: #[Auditable] entities get field-level before/after diffs
    # served at /api/audit-trail/{resource}/{id} (see Product + ProductsPage).
    audit:
        enabled: true
    # Privacy-safe product analytics. Requests only write to the local
    # transactional outbox; delivery happens asynchronously.
    analytics:
        enabled: '%env(bool:ANALYTICS_ENABLED)%'
        redaction_hmac_key: '%env(ANALYTICS_REDACTION_HMAC_KEY)%'
        delivery_endpoint: '%env(ANALYTICS_DELIVERY_ENDPOINT)%'
        delivery_token: '%env(ANALYTICS_DELIVERY_TOKEN)%'

when@dev:
    nubit_admin:
        auth:
            cookie_secure: false
