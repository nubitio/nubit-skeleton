# Every optional module below ships off. This template is a starting point,
# not a demonstration: anything enabled here becomes schema, endpoints and
# configuration that every project generated from it inherits and has to
# remove. Turn on what your product needs, one at a time.
#
# What each module adds — and what it requires — is documented in the
# admin-bundle README:
# https://github.com/nubitio/nubit-symfony/tree/main/packages/admin-bundle
nubit_admin:
    app_profile: internal
    auth:
        secret: '%env(APP_SECRET)%' # >= 32 bytes
        access_token_ttl: 3600
        refresh_token_ttl: 1209600
        # Secure cookies require HTTPS. The local docker stack runs plain HTTP,
        # so dev disables the flag below — keep it true in production.
        cookie_secure: true
    # Mercure subscriber cookie: `mercure: true` resources push live updates to
    # the grids through the hub in compose.yaml.
    mercure:
        enabled: true
        secret: '%env(MERCURE_JWT_SECRET)%'

    # ── Off by default ────────────────────────────────────────────────────
    # media:        POST /api/media uploads + the nubit_media table. Pair with
    #               x-crud format:'image'|'file' on the property.
    # audit:        field-level diffs for #[Auditable] entities, served at
    #               /api/audit-trail/{resource}/{id}, in nubit_audit_log.
    # export:       xlsx for resources marked #[Exportable]. Needs
    #               phpoffice/phpspreadsheet with ext-zip and ext-gd.
    # notification: in-app and email notifications + the nubit_notification
    #               table. Dispatch inside a tenant context or the tenant
    #               filter hides the result from its own recipient.
    # backup:       per-tenant pg_dump archives. Needs pg_dump on PATH.
    # analytics:    privacy-safe product analytics through a local outbox.
    # oidc:         authorization-code + PKCE SSO.
    #
    # Each one needs a migration once enabled:
    #   bin/console doctrine:migrations:diff

when@dev:
    nubit_admin:
        auth:
            cookie_secure: false
