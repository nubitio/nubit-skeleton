security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            custom_authenticator: Nubit\AdminBundle\Auth\JWTAuthenticator
            # When nubit_admin.identity.enabled, also add:
            # custom_authenticators:
            #   - Nubit\AdminBundle\Auth\JWTAuthenticator
            #   - Nubit\AdminBundle\Identity\ApiKeyAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/api/auth/(login|refresh|password), roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/oidc, roles: PUBLIC_ACCESS }
        - { path: ^/api/invitations/[^/]+$, roles: PUBLIC_ACCESS }
        - { path: ^/api/invitations/[^/]+/accept$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
